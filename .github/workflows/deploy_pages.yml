name: Deploy GitHub Pages

"on":
  workflow_dispatch: {}
  workflow_run:
    workflows:
      - Build static reference
      - Collect realtime snapshot
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul deploiement actif ; ne pas interrompre une publication en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # completed inclut les echecs : ne publier qu'apres un succes sur main.
    # Un lancement manuel doit egalement provenir de main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Le SHA du workflow de collecte precede son commit de donnees.
      # Recuperer main au debut du job inclut les JSON pousses avant sa reussite.
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload docs only
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
